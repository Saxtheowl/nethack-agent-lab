[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bothack-python"
version = "0.1.0"
description = "Portage vérifiable de BotHack pour NetHack 3.4.3-NAO (en cours)"
requires-python = ">=3.11"
license = {text = "GPL-2.0-only"}
dependencies = ["pyte==0.8.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "edn-format==0.7.5"]

[project.scripts]
bothack = "bothack.cli:main"

[tool.setuptools.packages.find]
include = ["bothack*"]

[tool.setuptools.package-data]
bothack = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["oracle: requires the original Clojure runtime", "integration: requires the historical NetHack executable"]
