<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle de contrôle</title>
<link rel="stylesheet" href="/ui/common.css">
<style>
.wall { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 14px; padding: 14px; }
.cell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cell .hd { display: flex; align-items: baseline; gap: 10px; } .cell .hd b { font-size: 18px; } .cell .hd .sp { flex: 1; }
.kpis { display: flex; gap: 16px; font-size: 13px; color: var(--muted); } .kpis b { font-size: 22px; color: var(--text); display: block; line-height: 1.1; }
.cell .term { cursor: zoom-in; }
.say { font-style: italic; color: #b9d3c8; min-height: 2.8em; font-size: 13.5px; }
.cell h3 { margin: 4px 0 0; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.moments { max-height: 220px; overflow: auto; }
.btns { display: flex; gap: 6px; }
/* focus overlay */
#focus { position: fixed; inset: 0; background: #070b0d; z-index: 20; display: none; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; padding: 12px; }
#focus.open { display: grid; }
#focus .main { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
#focus .main .term { flex: 1; min-height: 0; }
#focus .bar { display: flex; gap: 8px; align-items: center; }
#focus .side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
#focus .side .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#focus .list { overflow: auto; padding: 6px; flex: 1; }
#fstat { font-size: 15px; } #fstat b { color: var(--gold); }
#fsay { font-style: italic; color: #b9d3c8; }
.lvl { margin: 10px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); }
@media (max-width: 1100px) { .wall { grid-template-columns: 1fr; } #focus { grid-template-columns: 1fr; } }
</style></head><body>
<div class="top"><h1>Salle de contrôle</h1><span class="muted small">les parties en cours, en direct — cliquer un écran pour l’ouvrir en grand</span><span class="sp"></span>
  <nav><a href="/">Site actuel</a><a href="/ui/a" class="on">A · Salle de contrôle</a><a href="/ui/b">B · Récit</a><a href="/ui/c">C · Parcours</a></nav></div>
<div class="wall" id="wall"></div>

<div id="focus">
  <div class="main">
    <div class="bar"><button id="fclose">✕ Fermer (Échap)</button><span id="fstat"></span><span class="sp" style="flex:1"></span>
      <button id="fplay">▶ Lecture</button><select id="fspeed"><option value="3">×3</option><option value="8" selected>×8</option><option value="30">×30</option><option value="120">×120</option></select><button id="flive">● Direct</button></div>
    <div id="fterm"></div>
    <input type="range" id="fslider" min="0" max="0" value="0">
    <div id="fsay"></div>
  </div>
  <div class="side">
    <div class="head"><b>Tous les évènements</b><span class="sp" style="flex:1"></span>
      <button data-f="imp" class="on">Importants</button><button data-f="all">Tout</button><button data-f="say">Pensées</button></div>
    <div class="list" id="flist"></div>
  </div>
</div>

<script src="/ui/common.js"></script>
<script>
const cells = {};
async function refresh() {
  let d; try { d = await activeSlots(); } catch (e) { return; }
  const wall = $('#wall'); wall.style.setProperty('--n', Math.min(3, d.slots.length || 1));
  for (const {slot, info, meta} of d.slots) {
    let c = cells[slot];
    if (!c) {
      const node = el('div', {className: 'cell'});
      node.innerHTML = `<div class="hd"><b>Partie ${slot}</b><span class="muted st"></span><span class="sp"></span><span class="muted small gid"></span></div>
        <div class="kpis"><div><b class="dl"></b>Dlvl</div><div><b class="tu"></b>T</div><div><b class="xl"></b>XL</div><div><b class="hp"></b>HP</div><div><b class="ac"></b>AC</div></div>
        <div class="hpbar"><i></i></div><div class="t"></div><div class="say"></div>
        <h3>Moments forts</h3><div class="moments"></div>
        <div class="btns"><button class="open">⛶ Ouvrir en grand</button><button class="start">⏮ Revoir depuis le début</button></div>`;
      wall.append(node);
      c = cells[slot] = {node, term: new Term(node.querySelector('.t'))};
      node.querySelector('.t').onclick = () => openFocus(c.gid, 'live');
      node.querySelector('.open').onclick = () => openFocus(c.gid, 'live');
      node.querySelector('.start').onclick = () => openFocus(c.gid, 0);
    }
    c.gid = info.game_id;
    const q = s => c.node.querySelector(s), m = meta;
    q('.st').textContent = `${m.player || ''} · run ${m.run ?? '?'} · ${STATUS_FR[m.status] || m.status || ''}`;
    q('.dl').textContent = m.dlvl ?? '—'; q('.tu').textContent = fmtN(m.turn); q('.xl').textContent = m.xl ?? '—';
    q('.hp').textContent = m.hp != null ? `${m.hp}/${m.hpmax}` : '—'; q('.ac').textContent = m.ac ?? '—';
    const p = m.hpmax ? m.hp / m.hpmax : 1; q('.hpbar').className = 'hpbar ' + (p < .34 ? 'low' : p < .67 ? 'mid' : ''); q('.hpbar i').style.width = (p * 100) + '%';
    api('/api/live?slot=' + slot).then(l => {
      if (l.rows && l.rows.length) c.term.render(l.rows);
      const dec = (l.feed || []).filter(x => x.kind === 'decision').slice(-1)[0];
      q('.say').textContent = dec ? '« ' + dec.text + ' »' : '';
    }).catch(() => {});
    if (!c.momentsAt || Date.now() - c.momentsAt > 30000) {
      c.momentsAt = Date.now();
      api('/api/chronicle?all=1').then(ch => {
        const mine = ch.chronicle.filter(x => x.game === c.gid && (x.importance || 2) >= 2).slice(0, 12);
        q('.moments').replaceChildren(...mine.map(x => el('div', {className: 'ev imp', onclick: () => openFocus(c.gid, Math.max(0, x.frame - 15))},
          el('span', {className: 'ic', textContent: ICONS[x.kind] || '★'}), el('span', {className: 'tt', textContent: 'T' + (x.turn ?? '?')}), el('span', {className: 'lb', textContent: x.title}))));
        if (!mine.length) q('.moments').append(el('div', {className: 'muted small', textContent: 'Rien de marquant pour l’instant.'}));
      }).catch(() => {});
    }
  }
}
refresh(); setInterval(() => !document.hidden && !$('#focus').classList.contains('open') && refresh(), 2500);

/* focus: big replay + every event in a scrollable list */
let FILTER = 'imp';
const fterm = new Term($('#fterm'), {fitHeight: true});
const player = new Player(fterm, pl => {
  const g = pl.game, s = g.status[pl.pos] || [];
  $('#fstat').innerHTML = `Partie <b>${g.gid.replace(/-.*/, '')}</b> · T <b>${s[0] ?? '?'}</b> · Dlvl <b>${s[1] ?? '?'}</b> · HP <b>${s[2] ?? '?'}/${s[3] ?? '?'}</b> · XL <b>${s[4] ?? '?'}</b>` + (pl.follow ? ' · <b style="color:#7ddc6f">DIRECT</b>' : '');
  $('#fslider').max = g.frames.length - 1; $('#fslider').value = pl.pos;
  const d = g.sayAt(pl.pos); $('#fsay').textContent = d ? '« ' + d.text + ' »' : '';
  $('#fplay').textContent = pl.playing ? '⏸ Pause' : '▶ Lecture';
  let cur = null; for (const n of $('#flist').querySelectorAll('.ev')) { n.classList.remove('cur'); if (+n.dataset.f <= pl.pos) cur = n; }
  if (cur) { cur.classList.add('cur'); if (pl.playing || pl.follow) cur.scrollIntoView({block: 'nearest'}); }
});
function drawList() {
  const g = player.game; if (!g) return;
  const evs = g.events.filter(e => FILTER === 'all' ? true : FILTER === 'say' ? e.kind === 'say' : e.imp);
  const kids = []; let lvl = null;
  for (const e of evs) {
    const s = g.status[e.f], d = s ? s[1] : null;
    if (d !== lvl) { lvl = d; kids.push(el('div', {className: 'lvl', textContent: 'Dlvl ' + (d ?? '?')})); }
    const n = el('div', {className: 'ev ' + e.kind + (e.imp ? ' imp' : ''), title: e.text || e.label, onclick: () => { player.playing = false; player.seek(Math.max(0, e.f - 10)); }},
      el('span', {className: 'ic', textContent: ICONS[e.kind] || '•'}), el('span', {className: 'tt', textContent: s ? 'T' + s[0] : ''}), el('span', {className: 'lb', textContent: e.label}));
    n.dataset.f = e.f; kids.push(n);
  }
  $('#flist').replaceChildren(...kids);
}
async function openFocus(gid, at) {
  $('#focus').classList.add('open'); $('#flist').replaceChildren(el('div', {className: 'muted', textContent: 'Chargement de la partie…'}));
  await player.open(gid, at); drawList(); fterm.fit();
}
$('#fclose').onclick = () => { $('#focus').classList.remove('open'); player.playing = false; };
$('#fplay').onclick = () => { player.playing = !player.playing; player.follow = false; player.onSeek(player); };
$('#flive').onclick = () => { player.follow = true; player.seek(player.game.frames.length - 1); player.follow = true; };
$('#fspeed').onchange = e => player.speed = +e.target.value;
$('#fslider').oninput = e => { player.playing = false; player.seek(+e.target.value); };
for (const b of document.querySelectorAll('#focus .head button')) b.onclick = () => { FILTER = b.dataset.f; for (const x of document.querySelectorAll('#focus .head button')) x.classList.toggle('on', x === b); drawList(); player.onSeek(player); };
addEventListener('keydown', e => {
  if (!$('#focus').classList.contains('open')) return;
  if (e.key === 'Escape') $('#fclose').click();
  else if (e.key === ' ') { e.preventDefault(); $('#fplay').click(); }
  else if (e.key === 'ArrowRight') player.seek(player.pos + (e.shiftKey ? 50 : 1));
  else if (e.key === 'ArrowLeft') player.seek(player.pos - (e.shiftKey ? 50 : 1));
});
</script></body></html>
