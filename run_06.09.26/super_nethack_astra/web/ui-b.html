<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Récit des parties</title>
<link rel="stylesheet" href="/ui/common.css">
<style>
body { height: 100vh; display: flex; flex-direction: column; }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr) 400px; gap: 12px; padding: 12px; }
.games, .story { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 0; display: flex; flex-direction: column; }
.games h2, .story h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 12px 12px 6px; }
.glist { overflow: auto; padding: 0 8px 8px; }
.g { padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 4px; }
.g:hover { background: var(--panel2); } .g.on { border-color: var(--accent); background: #1a2922; }
.g b { display: block; } .g .small { color: var(--muted); }
.g .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7ddc6f; margin-right: 6px; }
.g .dot.dead { background: var(--bad); } .g .dot.quit { background: #6a7a86; }
.center { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.head { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.head .k b { display: block; font-size: 24px; line-height: 1.1; } .head .k { color: var(--muted); font-size: 12px; }
.head .title { font-size: 18px; font-weight: 650; margin-right: 8px; }
#term { flex: 1; min-height: 0; }
.ctl { display: flex; gap: 8px; align-items: center; }
#depth { width: 100%; height: 34px; cursor: pointer; display: block; }
#say { font-style: italic; color: #b9d3c8; min-height: 1.4em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 8px; }
.chips button { padding: 3px 9px; font-size: 12.5px; }
.search { margin: 0 12px 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; color: var(--text); }
.feed { overflow: auto; padding: 0 6px 10px; flex: 1; }
.lvl { margin: 12px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); position: sticky; top: 0; background: var(--panel); padding: 2px 0; }
@media (max-width: 1200px) { .layout { grid-template-columns: 1fr; } body { height: auto; } #term { height: 60vh; } }
</style></head><body>
<div class="top"><h1>Récit des parties</h1><span class="muted small">une partie à la fois : l’écran, et à droite toute son histoire</span><span class="sp"></span>
  <nav><a href="/">Site actuel</a><a href="/ui/a">A · Salle de contrôle</a><a href="/ui/b" class="on">B · Récit</a><a href="/ui/c">C · Parcours</a></nav></div>
<div class="layout">
  <div class="games"><h2>En cours</h2><div class="glist" id="live"></div><h2>Terminées récemment</h2><div class="glist" id="past"></div></div>
  <div class="center">
    <div class="head" id="head"></div>
    <div id="term"></div>
    <canvas id="depth" title="Profondeur (Dlvl) au fil de la partie — cliquer pour y aller"></canvas>
    <div class="ctl"><button id="play">▶ Lecture</button><select id="speed"><option value="3">×3</option><option value="8" selected>×8</option><option value="30">×30</option><option value="120">×120</option></select>
      <button id="prev">◀ évènement</button><button id="next">évènement ▶</button><button id="livebtn">● Direct</button>
      <input type="range" id="slider" min="0" max="0" value="0" style="flex:1"></div>
    <div id="say"></div>
  </div>
  <div class="story"><h2>Toute l’histoire de la partie</h2>
    <div class="chips" id="chips"></div>
    <input class="search" id="search" placeholder="Chercher (monstre, objet…)">
    <div class="feed" id="feed"></div></div>
</div>
<script src="/ui/common.js"></script>
<script>
const KINDS = [['imp', 'Importants'], ['all', 'Tout'], ['item', '💎 Objets'], ['monster', '👹 Monstres'], ['danger', '♥ Dangers'], ['level', '▼ Niveaux'], ['say', '💬 Pensées']];
let KIND = 'imp', Q = '';
const term = new Term($('#term'), {fitHeight: true});
const player = new Player(term, update);
function update(pl) {
  const g = pl.game, s = g.status[pl.pos] || [];
  $('#head').innerHTML = `<span class="title">${g.gid.replace(/-20.*/, '')}</span>` +
    [['Dlvl', s[1]], ['T', s[0] != null ? fmtN(s[0]) : '?'], ['XL', s[4]], ['HP', s[2] != null ? `${s[2]}/${s[3]}` : '?'], ['AC', s[5]]]
      .map(([l, v]) => `<div class="k"><b>${v ?? '?'}</b>${l}</div>`).join('') + (pl.follow ? '<div class="k" style="color:#7ddc6f"><b>●</b>direct</div>' : '');
  $('#slider').max = g.frames.length - 1; $('#slider').value = pl.pos;
  const d = g.sayAt(pl.pos); $('#say').textContent = d ? '« ' + d.text + ' »' : '';
  $('#play').textContent = pl.playing ? '⏸ Pause' : '▶ Lecture';
  let cur = null; for (const n of $('#feed').querySelectorAll('.ev')) { n.classList.remove('cur'); if (+n.dataset.f <= pl.pos) cur = n; }
  if (cur) { cur.classList.add('cur'); if (pl.playing || pl.follow) cur.scrollIntoView({block: 'nearest'}); }
  drawDepth();
}
function drawDepth() {
  const g = player.game, c = $('#depth'); if (!g) return;
  const w = c.clientWidth, h = c.clientHeight; c.width = w; c.height = h;
  const x = c.getContext('2d'), n = Math.max(1, g.frames.length - 1), maxd = Math.max(5, ...g.status.filter(Boolean).map(s => +s[1] || 0));
  x.fillStyle = '#121b1f'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#7fb2e5'; x.lineWidth = 2; x.beginPath();
  const step = Math.max(1, Math.floor(g.frames.length / w));
  for (let i = 0; i < g.frames.length; i += step) { const s = g.status[i]; if (!s) continue; const px = i / n * w, py = 3 + (+s[1] || 0) / maxd * (h - 6); i ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke();
  x.fillStyle = '#fff'; x.fillRect(player.pos / n * w - 1, 0, 2, h);
}
$('#depth').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); player.playing = false; player.seek(Math.round((e.clientX - r.left) / r.width * (player.game.frames.length - 1))); };
function drawFeed() {
  const g = player.game; if (!g) return;
  const q = Q.toLowerCase();
  const evs = g.events.filter(e => (KIND === 'all' || (KIND === 'imp' ? e.imp : e.kind === KIND)) && (!q || (e.label + ' ' + (e.text || '')).toLowerCase().includes(q)));
  const kids = []; let lvl;
  for (const e of evs) {
    const s = g.status[e.f], d = s ? s[1] : null;
    if (d !== lvl) { lvl = d; kids.push(el('div', {className: 'lvl', textContent: 'Dlvl ' + (d ?? '?') + (s ? ' · T' + s[0] : '')})); }
    const n = el('div', {className: 'ev ' + e.kind + (e.imp ? ' imp' : ''), title: e.text || '', onclick: () => { player.playing = false; player.seek(Math.max(0, e.f - 10)); }},
      el('span', {className: 'ic', textContent: ICONS[e.kind] || '•'}), el('span', {className: 'tt', textContent: s ? 'T' + s[0] : ''}), el('span', {className: 'lb', textContent: e.label}));
    n.dataset.f = e.f; kids.push(n);
  }
  if (!kids.length) kids.push(el('div', {className: 'muted', style: 'padding:10px', textContent: 'Rien pour ce filtre.'}));
  $('#feed').replaceChildren(...kids);
  const counts = k => g.events.filter(e => k === 'all' || (k === 'imp' ? e.imp : e.kind === k)).length;
  $('#chips').replaceChildren(...KINDS.map(([k, l]) => el('button', {className: KIND === k ? 'on' : '', textContent: `${l} (${counts(k)})`, onclick: () => { KIND = k; drawFeed(); update(player); }})));
}
$('#search').oninput = e => { Q = e.target.value; drawFeed(); };
async function open(gid, at) {
  for (const n of document.querySelectorAll('.g')) n.classList.toggle('on', n.dataset.gid === gid);
  $('#feed').replaceChildren(el('div', {className: 'muted', style: 'padding:10px', textContent: 'Chargement…'}));
  await player.open(gid, at); drawFeed(); update(player); term.fit();
  history.replaceState(null, '', '#game=' + encodeURIComponent(gid));
}
function nextEv(dir) {
  const g = player.game, evs = g.events.filter(e => KIND === 'all' || (KIND === 'imp' ? e.imp : e.kind === KIND));
  const e = dir > 0 ? evs.find(e => e.f > player.pos + 10) : [...evs].reverse().find(e => e.f < player.pos - 10);
  if (e) { player.playing = false; player.seek(Math.max(0, e.f - 10)); }
}
$('#play').onclick = () => { player.playing = !player.playing; player.follow = false; update(player); };
$('#speed').onchange = e => player.speed = +e.target.value;
$('#slider').oninput = e => { player.playing = false; player.seek(+e.target.value); };
$('#prev').onclick = () => nextEv(-1); $('#next').onclick = () => nextEv(1);
$('#livebtn').onclick = () => { player.follow = true; player.seek(player.game.frames.length - 1); player.follow = true; update(player); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowRight') player.seek(player.pos + (e.shiftKey ? 50 : 1));
  else if (e.key === 'ArrowLeft') player.seek(player.pos - (e.shiftKey ? 50 : 1));
  else if (e.key === 'n') nextEv(1); else if (e.key === 'p') nextEv(-1);
});
(async () => {
  const {slots, games} = await activeSlots();
  const card = (g, live) => { const n = el('div', {className: 'g', onclick: () => open(g.id, live ? 'live' : 'end')},
    el('b', {}, el('span', {className: 'dot ' + (g.status || '')}), `Partie ${g.slot} · run ${g.run ?? '?'}`),
    el('div', {className: 'small', textContent: `Dlvl ${g.dlvl ?? '?'} · T${fmtN(g.turn || g.turns)} · ${g.status === 'dead' ? '☠ ' + (g.death || '') : STATUS_FR[g.status] || ''}`})); n.dataset.gid = g.id; return n; };
  $('#live').replaceChildren(...slots.map(s => card({...s.meta, id: s.info.game_id, slot: s.slot}, true)));
  const liveIds = new Set(slots.map(s => s.info.game_id));
  $('#past').replaceChildren(...games.filter(g => !liveIds.has(g.id)).slice(0, 25).map(g => card(g, false)));
  const h = new URLSearchParams(location.hash.slice(1)).get('game');
  open(h || (slots[0] && slots[0].info.game_id) || games[0].id, 'live');
})();
</script></body></html>
